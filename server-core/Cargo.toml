[package]
name = "server-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = [ "runtime-tokio", "sqlite", "migrate" ] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
